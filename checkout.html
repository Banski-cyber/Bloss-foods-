<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Review | Bloss Foods</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">BLOSS <span>FOODS</span></div>
        <a href="index.html" style="color: var(--gold); text-decoration: none; font-size: 0.8rem;">← Back to Shop</a>
    </nav>

    <div class="checkout-wrapper">

        <div class="order-review-container">
            <h3 style="color: var(--gold); text-align: center; margin-bottom: 15px;">Order Review</h3>
            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
                <span>1x Rice (Congo)</span>
                <span style="color: #ff4d4d; cursor: pointer;">&times;</span>
            </div>
            <div style="margin-top: 15px;">
                <div style="display: flex; justify-content: space-between;">
                    <span>Subtotal:</span>
                    <span>₦1,900</span>
                </div>
                <div style="display: flex; justify-content: space-between; color: var(--gold-bright);">
                    <small>Delivery Fee:</small>
                    <small>Check below...</small>
                </div>
            </div>
        </div>

        <div class="delivery-details-container">
            <h3 style="color: var(--gold); text-align: center;">Delivery Details</h3>
            <p style="font-size: 0.65rem; color: var(--gold-bright); text-align: center; margin-bottom: 15px;">
                * FREE for school hostels. ₦500 for off-campus.
            </p>

            <label style="font-size: 0.8rem;">Your Name</label>
            <input type="text" placeholder="Enter your name">

            <label style="font-size: 0.8rem;">Detailed Address (Hostel & Room No)</label>
            <textarea rows="3" placeholder="e.g. Mandela Hostel, Room 202"></textarea>

            <button class="confirm-btn">Confirm on WhatsApp</button>
        </div>

    </div>

</body>
</html>
