<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Review | Bloss Foods</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">BLOSS <span>FOODS</span></div>
        <a href="index.html" style="color: var(--gold); text-decoration: none; font-size: 0.8rem;">← Back to Shop</a>
    </nav>

    <div class="checkout-wrapper">

        <div class="order-review-container">
            <h3 style="color: var(--gold); text-align: center; margin-bottom: 15px;">Order Review</h3>
            <div style="display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px;">
                <span>1x Rice (Congo)</span>
                <span style="color: #ff4d4d; cursor: pointer;">&times;</span>
            </div>
            <div style="margin-top: 15px;">
                <div style="display: flex; justify-content: space-between;">
                    <span>Subtotal:</span>
                    <span id="order-total">₦1,900</span>
                </div>
                <div style="display: flex; justify-content: space-between; color: var(--gold-bright);">
                    <small>Delivery Fee:</small>
                    <small>Check below...</small>
                </div>
            </div>
        </div>

        <div class="delivery-details-container">
            <h3 style="color: var(--gold); text-align: center;">Delivery Details</h3>
            <p style="font-size: 0.65rem; color: var(--gold-bright); text-align: center; margin-bottom: 15px;">
                * FREE for school hostels. ₦500 for off-campus.
            </p>

            <label style="font-size: 0.8rem;">Your Name</label>
            <input type="text" id="cust-name" placeholder="Enter your name">

            <label style="font-size: 0.8rem;">Detailed Address (Hostel & Room No)</label>
            <textarea id="cust-address" rows="3" placeholder="e.g. Mandela Hostel, Room 202"></textarea>

            <button class="confirm-btn" onclick="sendToWhatsApp()">Confirm on WhatsApp</button>
        </div>

    </div>

    <script>
        function sendToWhatsApp() {
            // Your number formatted for the WhatsApp API (Country Code + Number minus the first 0)
            const phoneNumber = "2349033448814"; 

            // Grabbing the information the user typed in
            const name = document.getElementById('cust-name').value;
            const address = document.getElementById('cust-address').value;
            const total = document.getElementById('order-total').innerText;

            // Ensure the user actually filled out the form before sending
            if (name === "" || address === "") {
                alert("Please enter your name and address before confirming.");
                return;
            }

            // Formatting the message that will appear in your WhatsApp chat
            const message = `*New Order from Bloss Foods*%0A%0A` +
                            `*Name:* ${name}%0A` +
                            `*Address:* ${address}%0A%0A` +
                            `*Order Detail:* 1x Rice (Congo)%0A` +
                            `*Subtotal:* ${total}%0A%0A` +
                            `Please confirm my order!`;

            // Opening the WhatsApp link in a new tab
            const whatsappURL = `https://wa.me/${phoneNumber}?text=${message}`;
            window.open(whatsappURL, '_blank');
        }
    </script>

</body>
</html>
