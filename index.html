<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloss Foods | Premium Staples</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">BLOSS <span>FOODS</span></div>
        <div style="display:flex; gap:20px;">
            <a href="shop.html" style="color:var(--gold); text-decoration:none; font-weight:bold;">SHOP NOW</a>
            <a href="#" onclick="openAdmin()" style="opacity:0.1;">Staff</a>
        </div>
    </nav>

    <header class="hero">
        <div>
            <h1 style="font-family:'Playfair Display'; font-size:3.5rem; margin:0;">Bloss Foods</h1>
            <p style="color:var(--gold-bright); font-weight:600; letter-spacing:2px;">FOOD WITHOUT BORDERS, DELIVERED SMARTER.</p>
            <a href="shop.html" class="add-btn" style="padding:15px 40px; text-decoration:none; display:inline-block; width:auto; margin-top:20px;">ENTER THE SHOP</a>
        </div>
    </header>

    <section style="padding:80px 10%; text-align:center; background:var(--emerald-deep);">
        <h2 style="color:var(--gold-bright); font-family:'Playfair Display'; font-size:2rem;">The Social Wall</h2>
        <div id="wall-feed" style="max-width:600px; margin:0 auto;"></div>
        <div class="card" style="max-width:500px; margin:40px auto; border: 1px solid var(--gold);">
            <h4>Share Your Experience</h4>
            <select id="rev-rating" class="qty-input" style="width:auto; margin-bottom:15px;">
                <option value="5">⭐⭐⭐⭐⭐</option>
                <option value="4">⭐⭐⭐⭐</option>
                <option value="3">⭐⭐⭐</option>
            </select>
            <textarea id="rev-comment" placeholder="Write your comment here..." class="qty-input" style="height:80px;"></textarea>
            <button onclick="postReview()" class="add-btn">Post to Wall</button>
        </div>
    </section>

    <button onclick="toggleChat()" style="position:fixed; bottom:25px; right:25px; background:var(--gold); border:none; width:60px; height:60px; border-radius:50%; cursor:pointer; z-index:3001; font-size:1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">💬</button>
    
    <div id="ai-chat" style="display:none; position:fixed; bottom:100px; right:25px; width:320px; background:var(--midnight); border:1px solid var(--gold); border-radius:15px; overflow:hidden; z-index:3000; box-shadow: 0 10px 30px rgba(0,0,0,0.8);">
        <div style="background:var(--gold); color:#000; padding:12px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
            <span>Bloss AI Assistant</span>
            <span onclick="toggleChat()" style="cursor:pointer; font-size:1.5rem;">&times;</span>
        </div>
        <div id="chat-box" style="height:250px; padding:15px; overflow-y:auto; font-size:0.9rem; background:#000; color:#fff; text-align:left;">
            <div>AI: Welcome to Bloss Foods! Ask me about prices, delivery, or availability.</div>
        </div>
        <div style="display:flex; border-top:1px solid #222;">
            <input type="text" id="chat-input" placeholder="Type here..." style="flex:1; padding:12px; background:#111; color:#fff; border:none; outline:none;">
            <button onclick="askAI()" style="background:var(--gold); border:none; padding:10px 15px; font-weight:bold; cursor:pointer;">Go</button>
        </div>
    </div>

    <div id="admin-panel" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:var(--midnight); z-index:9999; padding:50px; overflow-y:auto;">
        <h2 style="color:var(--gold);">Staff Inventory Control</h2>
        <div id="admin-list" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin-top:20px;"></div>
        <button class="add-btn" onclick="saveInv()" style="width:200px; margin-top:30px;">Save Stock</button>
        <button onclick="location.reload()" style="color:white; background:none; border:none; margin-left:20px; cursor:pointer;">Exit</button>
    </div>

    <script src="script.js"></script>
    <script>
        function postReview() {
            const u = JSON.parse(localStorage.getItem('bloss_user')) || {name:"Guest"};
            const r = document.getElementById('rev-rating').value;
            const c = document.getElementById('rev-comment').value;
            if(!c) return alert("Please type a comment!");
            const revs = JSON.parse(localStorage.getItem('bloss_reviews')) || [];
            revs.unshift({ name: u.name, stars: "⭐".repeat(r), comment: c, date: new Date().toLocaleDateString() });
            localStorage.setItem('bloss_reviews', JSON.stringify(revs));
            location.reload();
        }

        function openAdmin() {
            if(prompt("Staff Key:") === "Bloss2026") {
                document.getElementById('admin-panel').style.display='block';
                const inv = JSON.parse(localStorage.getItem('bloss_inventory')) || {};
                document.getElementById('admin-list').innerHTML = Object.keys(inv).map(k => `
                    <div class="card"><h4>${k.toUpperCase()}</h4><input type="number" id="adm-${k}" value="${inv[k]}" class="qty-input"></div>
                `).join('');
            }
        }

        function saveInv() {
            let inv = {};
            document.querySelectorAll('[id^="adm-"]').forEach(i => { inv[i.id.split('-')[1]] = parseInt(i.value); });
            localStorage.setItem('bloss_inventory', JSON.stringify(inv));
            alert("Inventory Synced!"); location.reload();
        }

        window.onload = () => {
            const revs = JSON.parse(localStorage.getItem('bloss_reviews')) || [];
            const feed = document.getElementById('wall-feed');
            if(feed) feed.innerHTML = revs.map(r => `
                <div class="card" style="margin-bottom:15px; text-align:left; border-left:4px solid var(--gold);">
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:var(--gold);">
                        <strong>${r.name}</strong> <span>${r.date}</span>
                    </div>
                    <div style="margin:5px 0;">${r.stars}</div>
                    <p style="margin:0; opacity:0.8; font-size:0.9rem;">${r.comment}</p>
                </div>`).join('');
        };
    </script>
</body>
</html>
