<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Bloss Foods</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <div class="logo">BLOSS <span>FOODS</span></div>
        <div style="display:flex; gap:15px; align-items:center;">
            <a href="index.html" style="color:var(--soft-white); text-decoration:none; font-size:0.9rem;">Home</a>
            <button onclick="toggleCart()" class="add-btn" style="width:auto; padding:10px 20px;">Basket (<span id="cart-count">0</span>)</button>
        </div>
    </nav>

    <div style="padding:20px 5% 0; display:flex; gap:15px; flex-wrap:wrap;">
        <div class="search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-box" placeholder="Search products..." class="qty-input" oninput="handleSearch(this.value)">
        </div>
    </div>

    <div class="category-chips" id="category-chips"></div>

    <div class="product-grid" id="product-grid"></div>

    <div id="cart-sidebar" class="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h3 style="color:var(--gold-bright);">Your Basket</h3>
            <button onclick="toggleCart()" style="background:none; border:none; color:white; font-size:2rem; cursor:pointer;">&times;</button>
        </div>
        <div id="side-cart-items"></div>
        <div style="border-top:1px solid var(--gold); margin-top:20px; padding-top:20px;">
            <h4>Total: ₦<span id="side-total">0</span></h4>
            <a href="checkout.html" class="add-btn" style="display:block; text-align:center; text-decoration:none; margin-top:15px;">Proceed to Checkout</a>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        window.currentCategory = 'All';
        window.currentSearch = '';

        function handleSearch(val) {
            window.currentSearch = val;
            renderShop(window.currentCategory, window.currentSearch);
        }

        function selectCategory(cat) {
            window.currentCategory = cat;
            document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.cat === cat));
            renderShop(window.currentCategory, window.currentSearch);
        }

        const categories = ['All', ...new Set(PRODUCTS.map(p => p.category)), 'Favorites'];
        document.getElementById('category-chips').innerHTML = categories.map(c =>
            `<button class="chip ${c === 'All' ? 'active' : ''}" data-cat="${c}" onclick="selectCategory('${c}')">${c === 'Favorites' ? '♥ Favorites' : c}</button>`
        ).join('');

        renderShop();
    </script>
</body>
</html>
